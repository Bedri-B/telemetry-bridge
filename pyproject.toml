[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-bridge"
version = "0.1.0"
description = "Dual-stream telemetry bridge for iRacing, Assetto Corsa and ACC: live WebSocket broadcast + high-frequency Parquet logging"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "websockets>=13.0",
    "PyYAML>=6.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
iracing = ["pyirsdk>=1.3.5"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
telemetry-bridge = "telemetry_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["telemetry_bridge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
